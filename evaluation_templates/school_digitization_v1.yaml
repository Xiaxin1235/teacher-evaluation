# 学校数字化评估模板（由 questions.csv 自动生成）
# 一级维度均分权重；题面归一化得分 0~1 ×100 后加权。
template:
  name: "学校数字化评估 v1（真实问卷）"
  school_year: "2020-2023"
  version: 1
  object_type: school
  weight_total: 1.0

