        level2: 资源规模
        weight: 1.0
      - id: 5
        content: 学校开展的.三个课堂.应用的数量
        level2: 资源应用
        weight: 1.0
      - id: 6
        content: 学校开展.三个课堂.教学的应用模式有多少个
        level2: 资源应用
        weight: 1.0
